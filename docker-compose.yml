services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-graph
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p '${NEO4J_PASSWORD}' 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
